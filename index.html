  const p = S.docs.get("profile");

  const v1 = S.docs.get("settings")?.goal;

      split:{c:Math.round(v1.carbs*4/k*100), p:Math.round(v1.protein*4/k*100), f:100-Math.round(v1.carbs*4/k*100)-Math.round(v1.protein*4/k*100)}, legacy:true};

function calc(p){

  const floor = p.sex === "f" ? 1200 : 1500;

/* ================= AI logging ================= */
function aiPrompt(text, hasPhoto){
  const p = profile(), w = latestWeight(S.sel);
  return `You are the nutrition engine of a calorie-tracking app. Read the person's log entry${hasPhoto ? " and the attached meal photo" : ""} and return structured data.

Person: ${p.sex === "f" ? "female" : "male"}, ${p.age} years, ${w} kg. They live in India: read Indian dishes and household measures (katori about 150 ml, roti about 40 g, typical home oil and ghee use) unless the entry says otherwise.

Entry: ${text ? JSON.stringify(text) : "(no text; use the photo)"}

Rules
- Separate FOOD/DRINK from EXERCISE. Either may be absent: use null.
- Food: one item per distinct food or drink. Estimate edible grams for each from stated amounts, household measures${hasPhoto ? ", or plate, bowl and cutlery size in the photo" : ""}. Name items in title case without the weight, e.g. "Grilled Salmon"; add a count in parentheses when natural, e.g. "Boiled Eggs (2)".
- Nutrients are for the whole item at that weight, from standard composition data (USDA FoodData Central; IFCT 2017 for Indian foods). kcal must agree with Atwater factors (4 kcal/g protein and digestible carbohydrate, 2 kcal/g fibre, 9 kcal/g fat, 7 kcal/g alcohol) within a few percent.
- carbs = total carbohydrate including fibre and sugars. fiber = solFiber + insolFiber.
${hasPhoto ? "- For every item add x and y: the item's centre in the photo as a percentage of image width and height (0-100).\n" : ""}- food.note: 1-2 plain sentences on what this meal does for the person nutritionally (protein, fibre, notable vitamins or minerals). Friendly; no scores, warnings or guilt.
- Exercise: list each activity with minutes and a MET value from the 2024 Adult Compendium of Physical Activities matched to the stated intensity. If only distance is given, convert to minutes using a typical recreational pace and include the pace in the name, e.g. "Jogging 5 km (~6 min/km)". exercise.note: 1-2 encouraging sentences written for someone of this weight; write the token {kcal} exactly where the total calories burned belongs (the app calculates it).

Units: grams for grams, carbs, protein, fat, fiber, solFiber, insolFiber, starch, sugars, sat, mono, poly, omega3, omega6, trans, alcohol, water; kcal for kcal; mg for chol, caffeine, b1, b2, b3, b5, b6, vitC, vitE, calcium, copper, iron, magnesium, manganese, phosphorus, potassium, sodium, zinc; µg for b12, folate (DFE), vitA (RAE), vitD, vitK, selenium.

Reply with only this JSON (numbers, not strings; 0 when a nutrient is absent):
{"food":{"title":"short combined name","items":[{"name":"","grams":0,${hasPhoto ? '"x":50,"y":50,' : ""}"kcal":0,"carbs":0,"protein":0,"fat":0,"fiber":0,"solFiber":0,"insolFiber":0,"starch":0,"sugars":0,"sat":0,"mono":0,"poly":0,"omega3":0,"omega6":0,"trans":0,"chol":0,"alcohol":0,"caffeine":0,"water":0,"b1":0,"b2":0,"b3":0,"b5":0,"b6":0,"b12":0,"folate":0,"vitA":0,"vitC":0,"vitD":0,"vitE":0,"vitK":0,"calcium":0,"copper":0,"iron":0,"magnesium":0,"manganese":0,"phosphorus":0,"potassium":0,"selenium":0,"sodium":0,"zinc":0}],"note":""},"exercise":{"title":"Jogging 5 km + Swimming 30 min","activities":[{"name":"","minutes":0,"met":0}],"note":""}}`;
}
function cleanItem(i){
  const o = {name:String(i.name || "Food").trim().slice(0, 80), grams:Math.max(0, r0(i.grams))};
  NK.forEach(k => o[k] = Math.max(0, N(i[k])));
  o.vitD = o.vitD * 40; // µg → IU for display and targets
  const fib = Math.min(o.fiber, o.carbs);
  const atw = 4*o.protein + 4*Math.max(0, o.carbs - fib) + 2*fib + 9*o.fat + 7*o.alcohol;
  if (atw >= 20 && Math.abs(o.kcal - atw) / atw > 0.15) o.kcal = atw; // keep energy consistent with macros
  o.kcal = Math.round(o.kcal);
  ["carbs","protein","fat"].forEach(k => o[k] = r1(o[k]));
  if (i.x != null && i.y != null){ o.x = clamp(N(i.x), 3, 97); o.y = clamp(N(i.y), 4, 96); }
  return o;
}
function joinNames(names){
  if (names.length <= 1) return names[0] || "Meal";
  if (names.length === 2) return names.join(" and ");
  return names.slice(0, -1).join(", ") + ", and " + names[names.length - 1];
}
function mkActivities(list, w){
  return (list || []).filter(a => a && a.name && N(a.minutes) > 0).map(a => {
    const met = clamp(N(a.met) || 3.5, 1, 23), minutes = r0(a.minutes);
    return {name:String(a.name).slice(0, 80), minutes, met:r1(met), kcal:Math.round(met * w * minutes / 60)};
  });
}
function tsFor(date){ const n = new Date(), d = D(date); d.setHours(n.getHours(), n.getMinutes(), n.getSeconds()); return d.getTime(); }
async function prepImage(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  const draw = max => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c; };
  const big = draw(1280);
  const blob = await new Promise(r => big.toBlob(r, "image/jpeg", 0.85));
  const thumb = draw(160).toDataURL("image/jpeg", 0.72);
  return {url, blob, thumb};
}
async function logIt(text, file, date = S.sel){
  text = (text || "").trim();
  if (!text && !file) return;
  if (S.mode === "pending"){ toast("Still connecting to your saved log. Try again in a moment."); return; }
  const p = {date, text, file, thumb:null}; S.pending.unshift(p);
  let prepared = null;
  try {
    if (file){ prepared = await prepImage(file); p.thumb = prepared.thumb; showScan(prepared.url); }
    render();
    if (!S.sample) throw {message:"AI estimates aren't available in this view. Enter it manually instead."};
    const opts = {modelTier:"default"};
    if (prepared) opts.images = [prepared.blob];
    const upload = prepared && S.assets ? S.assets.upload(prepared.blob).catch(() => null) : Promise.resolve(null);
    const res = await S.sample.json(aiPrompt(text, !!prepared), opts);
    const asset = await upload;
    const made = [];
    const items = (res?.food?.items || []).filter(i => i && i.name).map(cleanItem);
    if (items.length){
      const title = items.length <= 4 ? joinNames(items.map(i => i.name)) : String(res.food.title || joinNames(items.slice(0, 3).map(i => i.name)));
      const e = {kind:"entry", type:"food", date, ts:tsFor(date), text, title, items, note:String(res.food.note || "").slice(0, 400),
        photo:prepared ? {thumb:prepared.thumb, url:asset?.url || null, id:asset?.id || null} : null};
      made.push(["e" + uid(""), e]);
    }
    const w = latestWeight(date);
    const acts = mkActivities(res?.exercise?.activities, w);
    if (acts.length){
      const burned = acts.reduce((a, x) => a + x.kcal, 0);
      made.push(["e" + uid(""), {kind:"entry", type:"exercise", date, ts:tsFor(date) + 1, text, title:String(res.exercise.title || acts.map(a => a.name).join(" + ")).slice(0, 100),
        activities:acts, burned, weightUsed:w, note:String(res.exercise.note || "").replaceAll("{kcal}", fmt(burned)).slice(0, 400)}]);
    }
    if (!made.length) throw {message:"I couldn't find any food or exercise in that. Add a little more detail and try again."};
    S.pending = S.pending.filter(x => x !== p);
    for (const [id, e] of made) await store.put(id, e);
    if (prepared){ const fe = made.find(([, e]) => e.type === "food"); if (fe) showLabels(prepared.url, fe[1]); }
  } catch(e){
    p.error = e?.code === "not_granted" ? "AI access was declined for this page. You can still enter meals manually."
      : e?.code === "rate_limited" ? "Too many requests right now. Wait a minute, then try again."
      : e?.code === "invalid_json" ? "The estimate came back incomplete. Try again, or split the meal into shorter entries."
      : (e?.message || "Something went wrong while estimating.");
    closeViewer(); render();
  }
}

/* ================= backup & restore ================= */
function backupJSON(){
  return JSON.stringify({app:"thali", version:2, exported:new Date().toISOString(), docs:Object.fromEntries(S.docs)}, null, 1);
}
function openBackup(){
  const status = h("div", {class:"small muted"});
  const fileIn = h("input", {type:"file", accept:".json,application/json", id:"bk-file", class:"inp"});
  let parsed = null, armed = false;
  const restore = h("button", {class:"btn pri", text:"Restore", disabled:true});
  fileIn.onchange = async () => {
    parsed = null; restore.disabled = true; armed = false; restore.textContent = "Restore";
    const f = fileIn.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.app !== "thali" || !j.docs || typeof j.docs !== "object") throw new Error("This isn't a Thali backup file.");
      parsed = j.docs;
      const n = Object.values(parsed).filter(v => v && (v.kind === "entry" || v.kind === "meal")).length;
      status.textContent = `Backup from ${fmtLong(iso(new Date(j.exported)))}: ${n} entries, ${Object.keys(parsed).length} records in total.`;
      restore.disabled = false;
    } catch(e){ status.textContent = "Couldn't read that file: " + e.message; }
  };
  restore.onclick = async () => {
    if (!parsed) return;
    if (!armed){ armed = true; restore.textContent = "Tap again to restore"; status.textContent += " Records with the same ID will be replaced; everything else stays."; return; }
    restore.disabled = true; let done = 0;
    const ids = Object.keys(parsed);
    for (const id of ids){
      const v = parsed[id]; if (!v || typeof v !== "object" || !v.kind) continue;
      try { await store.put(id, v); done++; status.textContent = `Restoring… ${done} of ${ids.length}`; }
      catch(e){ status.textContent = `Stopped after ${done} records: ${e.message || e.code}. Try again to continue.`; restore.disabled = false; return; }
    }
    status.textContent = `Restored ${done} records.`; toast("Backup restored");
  };
  const dl = h("button", {class:"btn pri", text:"Download backup"});
  dl.onclick = async () => {
    const name = `thali-backup-${todayISO()}.json`;
    try {
      if (!S.downloads) throw {code:"unavailable"};
      await S.downloads.save({filename:name, data:new Blob([backupJSON()], {type:"application/json"})});
      status.textContent = "Backup saved as " + name + ".";
    } catch(e){
      if (e?.code === "declined"){ status.textContent = "Download cancelled."; return; }
      try { await navigator.clipboard.writeText(backupJSON()); status.textContent = "Downloads aren't available here, so the backup was copied to your clipboard. Paste it into a file named " + name + "."; }
      catch(_){ status.textContent = "Downloads aren't available in this view."; }
    }
  };
  sheet("Backup & restore", h("div", {class:"stack"},
    h("p", {class:"muted", style:"margin:0", text:`Your log has ${S.docs.size} records. A backup is one file with all your meals, workouts, goals, water, weight, sleep, cycle data and saved meals (photos are kept as small thumbnails).`}),
    h("div", {}, dl),
    h("h3", {class:"h3", style:"margin-top:8px", text:"Restore from a backup"}),
    h("label", {class:"field", for:"bk-file"}, "Backup file", fileIn),
    h("div", {}, restore), status));
}

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep, last 7 nights">`;
  [0, 4, 8].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v === 8 ? 'stroke-dasharray="4 4"' : ""}/><text x="${L - 5}" y="${Y(v) + 3.5}" text-anchor="end" fill="var(--muted)" font-size="10">${v}h</text>`);
  sl.forEach(([d, hrs, q], i) => { const cx = L + (W - L - R) / 7 * (i + .5);
    if (hrs > 0) s += `<rect x="${cx - bw / 2}" y="${Y(Math.min(hrs, max))}" width="${bw}" height="${Y(0) - Y(Math.min(hrs, max))}" rx="3" fill="var(--protein)" opacity="${q ? .45 + q * .11 : .7}"><title>${fmtDay(d)}: ${fmt(hrs, 2)} h${q ? ", " + QUAL[q - 1] : ""}</title></rect>`;
    s += `<text x="${cx}" y="${H - 5}" text-anchor="middle" fill="var(--muted)" font-size="10">${"MTWTFSS"[(D(d).getDay() + 6) % 7]}</text>`; });
  return h("div", {class:"chart", html:s + "</svg>"});
}

/* ================= cycle ================= */
function cycleStats(){
  const ps = periods(); if (!ps.length) return null;
  const gaps = []; for (let i = 1; i < ps.length; i++){ const g = daysBetween(ps[i - 1].start, ps[i].start); if (g >= 15 && g <= 60) gaps.push(g); }
  const recent = gaps.slice(-6);
  const avgCycle = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : 28;
  const lens = ps.slice(-6).map(p => N(p.length)).filter(Boolean);
  const avgLen = lens.length ? Math.round(lens.reduce((a, b) => a + b, 0) / lens.length) : 5;
  const last = ps.at(-1).start, next = addDays(last, avgCycle);
  const ov = addDays(next, -14);
  return {avgCycle, avgLen, next, last, learned:recent.length, ovulation:ov, fertileStart:addDays(ov, -5), fertileEnd:addDays(ov, 1), count:ps.length};
}
function viewCycle(v){
  const p = profile();
  if (!p.cycle){
    v.append(h("div", {class:"card dsum stack"}, h("h3", {class:"h3", text:"Cycle tracking"}),
      h("p", {class:"muted", style:"margin:0", text:"Optional period tracking that learns your average cycle length from your own history and estimates your next period. It stays private to you."}),
      h("button", {class:"btn pri", style:"align-self:flex-start", text:"Turn on cycle tracking", onclick:() => saveProfile({...profile(), cycle:true})})));
    return;
  }
  const c = cycleStats(), today = todayISO();
  const startIn = h("input", {class:"inp", id:"c-start", type:"date", max:today, value:S.sel});
  const lenIn = h("input", {class:"inp", id:"c-len", type:"number", min:1, max:12, value:c ? c.avgLen : 5});
  const pred = c ? (() => { const dn = daysBetween(today, c.next);
    return h("div", {class:"card dsum stack"},
      h("div", {class:"small muted", text:"Next period (estimate)"}),
      h("div", {style:"font-size:1.5rem;font-weight:900;color:var(--pink)", text:fmtLong(c.next)}),
      h("div", {style:"font-weight:700", text:dn > 0 ? `in ${dn} day${dn === 1 ? "" : "s"}` : dn === 0 ? "expected today" : `${-dn} day${dn === -1 ? "" : "s"} later than expected`}),
      h("div", {class:"kv4", style:"grid-template-columns:repeat(3,minmax(0,1fr))"},
        h("div", {}, h("div", {class:"v", text:`${c.avgCycle} d`}), h("div", {class:"k", text:"Avg cycle"})),
        h("div", {}, h("div", {class:"v", text:`${c.avgLen} d`}), h("div", {class:"k", text:"Avg period"})),
        h("div", {}, h("div", {class:"v", text:`${c.count}`}), h("div", {class:"k", text:"Periods logged"}))),
      h("div", {class:"small", text:`Estimated fertile window: ${fmtDay(c.fertileStart)} – ${fmtDay(c.fertileEnd)} (ovulation ≈ ${fmtDay(c.ovulation)}, 14 days before the next period).`}),
      h("div", {class:"small muted", text:c.learned ? `Learned from your last ${c.learned} cycle${c.learned > 1 ? "s" : ""}.` : "Using a 28-day default until you log a second period."}),
      h("div", {class:"small muted", text:"Estimates only; not a method of contraception."})); })()
    : h("div", {class:"card dsum muted", text:"Log the first day of your last period to get a prediction."});
  v.append(h("div", {class:"stack"}, pred,
    h("div", {class:"card dsum stack"}, h("h3", {class:"h3", text:"Log a period"}),
      h("div", {class:"grid2"}, h("label", {class:"field", for:"c-start"}, "First day", startIn), h("label", {class:"field", for:"c-len"}, "Length (days)", lenIn)),
      h("button", {class:"btn pri", style:"align-self:flex-start", text:"Save period", onclick:async () => {
        if (!startIn.value || startIn.value > today){ toast("Pick a start date that isn't in the future."); return; }
        const dup = periods().find(x => Math.abs(daysBetween(x.start, startIn.value)) < 10);
        await safePut(dup ? dup.id : "c" + uid(""), {kind:"period", start:startIn.value, length:clamp(r0(lenIn.value) || 5, 1, 12)}); toast(dup ? "Period updated" : "Period saved"); }})),
    h("div", {class:"card dsum"}, h("h3", {class:"h3", style:"margin-bottom:6px", text:"History"}),
      periods().length ? h("div", {class:"mlist"}, ...periods().slice().reverse().map((x, i, arr) => {
        const prev = arr[i + 1]; const len = prev ? daysBetween(prev.start, x.start) : null;
        return h("div", {class:"mi"}, h("div", {}, h("div", {class:"t", text:fmtLong(x.start)}), h("div", {class:"small muted", text:`${x.length} day period${len ? ` · ${len}-day cycle` : ""}`})),
          h("button", {class:"xrm", "aria-label":"Delete period starting " + fmtLong(x.start), onclick:() => store.del(x.id).catch(() => {})}, ic("trash", 16))); }))
      : h("p", {class:"small muted", text:"No periods logged yet."})),
    h("button", {class:"btn", style:"align-self:flex-start", text:"Turn off cycle tracking", onclick:() => saveProfile({...profile(), cycle:false})})));
}

/* ================= weekly ================= */
function viewWeekly(v, all){
  const ws = S.weekOf, days = Array.from({length:7}, (_, i) => addDays(ws, i)), g = goals();
  const tot = days.map(d => ({d, ...dayTotals(all, d)}));
  const loggedDays = tot.filter(x => x.meals > 0 && x.d <= todayISO());
  const avg = loggedDays.length ? loggedDays.reduce((a, x) => a + x.kcal, 0) / loggedDays.length : 0;
  const onTarget = loggedDays.filter(x => x.kcal >= g.kcal * 0.9 && x.kcal <= g.kcal * 1.1).length;
  const burned = tot.reduce((a, x) => a + x.burned, 0);
  const weighIns = [...S.docs.values()].filter(x => x.kind === "day" && N(x.weight) > 0).sort((a, b) => a.date < b.date ? -1 : 1);
  const inWeek = weighIns.filter(x => x.date >= ws && x.date <= days[6]);
  const before = weighIns.filter(x => x.date < ws).at(-1);
  const startW = before || inWeek[0], endW = inWeek.at(-1);
  const wChange = startW && endW && startW !== endW ? endW.weight - startW.weight : null;
  const sl = days.map(d => dayDoc(d)).filter(x => N(x.sleep) > 0);
  const avgSleep = sl.length ? sl.reduce((a, x) => a + N(x.sleep), 0) / sl.length : null;
  const sq = sl.filter(x => x.sleepQ); const avgQ = sq.length ? Math.round(sq.reduce((a, x) => a + x.sleepQ, 0) / sq.length) : null;
  const wat = days.map(d => N(dayDoc(d).water)).filter(Boolean); const avgWater = wat.length ? wat.reduce((a, b) => a + b, 0) / wat.length : null;
  const mac = k => loggedDays.length ? loggedDays.reduce((a, x) => a + x[k], 0) / loggedDays.length : 0;
  const nextOK = addDays(ws, 7) <= todayISO();
  const stat = (k, val, sub) => h("div", {class:"card stat"}, h("div", {class:"k", text:k}), h("div", {class:"v", text:val}), sub ? h("div", {class:"small muted", text:sub}) : null);
  // chart
  const W = 340, H = 160, L = 36, R = 8, T = 10, B = 22, max = Math.max(g.kcal * 1.3, ...tot.map(x => x.kcal)) || 1, bw = (W - L - R) / 7 * 0.56;
  const Y = val => T + (1 - val / max) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day this week">`;
  [0, Math.round(g.kcal / 2), g.kcal].forEach(val => s += `<line x1="${L}" x2="${W - R}" y1="${Y(val)}" y2="${Y(val)}" stroke="${val === g.kcal ? "var(--green)" : "var(--line)"}" ${val === g.kcal ? 'stroke-dasharray="5 4"' : ""}/><text x="${L - 5}" y="${Y(val) + 3.5}" text-anchor="end" fill="var(--muted)" font-size="10">${val >= 1000 ? fmt(val / 1000, 1) + "k" : val}</text>`);
  tot.forEach((x, i) => { const cx = L + (W - L - R) / 7 * (i + .5);
    if (x.kcal > 0) s += `<rect x="${cx - bw / 2}" y="${Y(x.kcal)}" width="${bw}" height="${Y(0) - Y(x.kcal)}" rx="3" fill="${x.kcal > g.kcal * 1.1 ? "var(--fat)" : "var(--green)"}"><title>${fmtDay(x.d)}: ${fmt(x.kcal)} kcal</title></rect>`;
    if (x.burned > 0) s += `<circle cx="${cx}" cy="${Y(Math.min(max, x.burned))}" r="3" fill="var(--carbs)"><title>Burned ${fmt(x.burned)} kcal</title></circle>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" fill="var(--muted)" font-size="10">${"MTWTFSS"[i]} ${D(x.d).getDate()}</text>`; });
  s += "</svg>";
  v.append(h("div", {class:"stack"},
    h("div", {class:"card", style:"display:flex;align-items:center;justify-content:space-between;padding:8px"},
      h("button", {class:"wk-arrow", "aria-label":"Previous week", onclick:() => { S.weekOf = addDays(ws, -7); render(); }}, ic("chevL")),
      h("strong", {text:`${fmtDay(ws)} – ${fmtDay(days[6])}`}),
      h("button", {class:"wk-arrow", "aria-label":"Next week", disabled:!nextOK, style:nextOK ? "" : "opacity:.3", onclick:() => { S.weekOf = addDays(ws, 7); render(); }}, ic("chevR"))),
    h("div", {class:"stat-grid"},
      stat("Avg calories", loggedDays.length ? fmt(avg) : "—", loggedDays.length ? `per logged day · goal ${fmt(g.kcal)}` : "no meals logged"),
      stat("Days on target", `${onTarget}/${loggedDays.length || 0}`, "within ±10% of goal"),
      stat("Calories burned", fmt(burned), "from logged exercise"),
      stat("Weight change", wChange == null ? "—" : `${wChange >= 0 ? "+" : ""}${fmt(wChange, 1)} kg`, endW ? `latest ${fmt(endW.weight, 1)} kg` : "no weigh-ins this week"),
      stat("Avg sleep", avgSleep == null ? "—" : `${fmt(avgSleep, 1)} h`, avgQ ? `quality: ${QUAL[avgQ - 1]}` : `${sl.length} nights logged`),
      stat("Avg water", avgWater == null ? "—" : `${fmt(avgWater / 1000, 2)} L`, `${wat.length} days logged`)),
    h("div", {class:"card dsum"}, h("h3", {class:"h3", style:"margin-bottom:8px", text:"Calories per day"}), h("div", {class:"chart", html:s}),
      h("div", {class:"small muted", text:"Dashed line: your goal. Blue dots: calories burned."})),
    h("div", {class:"card dsum"}, h("h3", {class:"h3", style:"margin-bottom:10px", text:"Average macros per logged day"}),
      h("div", {class:"stack", style:"gap:10px"}, ...[["Carbs", mac("carbs"), g.c, "var(--carbs)"], ["Protein", mac("protein"), g.p, "var(--protein)"], ["Fat", mac("fat"), g.f, "var(--fat)"]].map(([l, a, b, c]) =>
        h("div", {class:"mrow"}, h("span", {text:l}), pbar(pctOf(a, b), c), h("span", {class:"small", text:`${fmt(a)} / ${b} g`})))))));
}

/* ================= goals & profile ================= */
const ACT = [[1.2,"Sedentary (desk job, little exercise)"],[1.375,"Light (exercise 1–3 days/week)"],[1.55,"Moderate (3–5 days/week)"],[1.725,"Very active (6–7 days/week)"],[1.9,"Extra active (physical job + training)"]];
function profileFields(p, onChange){
  const f = {};
  const sel = (id, opts, val) => h("select", {class:"inp", id}, ...opts.map(([v, l]) => h("option", {value:v, text:l, selected:String(v) === String(val)})));
  f.sex = sel("p-sex", [["m","Male"],["f","Female"]], p.sex);
  f.age = h("input", {class:"inp", id:"p-age", type:"number", min:15, max:100, value:p.age});
  f.height = h("input", {class:"inp", id:"p-h", type:"number", min:100, max:250, value:p.height});
  f.weight = h("input", {class:"inp", id:"p-w", type:"number", min:25, max:300, step:0.1, value:p.weight});
  f.activity = sel("p-act", ACT, p.activity);
  f.goalType = sel("p-goal", [["lose","Lose weight"],["maintain","Maintain weight"],["gain","Gain weight"]], p.goalType);
  f.rate = sel("p-rate", [[0.25,"0.25 kg per week"],[0.5,"0.5 kg per week"],[0.75,"0.75 kg per week"],[1,"1 kg per week"]], p.rate);
  f.targetWeight = h("input", {class:"inp", id:"p-tw", type:"number", min:25, max:300, step:0.1, value:p.targetWeight});
  const rateWrap = h("label", {class:"field", for:"p-rate"}, "Pace", f.rate);
  const read = () => ({sex:f.sex.value, age:N(f.age.value), height:N(f.height.value), weight:N(f.weight.value), activity:N(f.activity.value),
    goalType:f.goalType.value, rate:N(f.rate.value), targetWeight:N(f.targetWeight.value)});
  const upd = () => { rateWrap.hidden = f.goalType.value === "maintain"; onChange(read()); };
  Object.values(f).forEach(x => x.addEventListener("input", upd));
  setTimeout(upd);
  const node = h("div", {class:"grid2"},
    h("label", {class:"field", for:"p-sex"}, "Sex", f.sex), h("label", {class:"field", for:"p-age"}, "Age", f.age),
    h("label", {class:"field", for:"p-h"}, "Height (cm)", f.height), h("label", {class:"field", for:"p-w"}, "Weight (kg)", f.weight),
    h("label", {class:"field", for:"p-act", style:"grid-column:1 / -1"}, "Activity level", f.activity),
    h("label", {class:"field", for:"p-goal"}, "Goal", f.goalType), rateWrap,
    h("label", {class:"field", for:"p-tw"}, "Target weight (kg)", f.targetWeight));
  return {node, read};
}
function validProfile(q){ return q.age >= 15 && q.age <= 100 && q.height >= 100 && q.height <= 250 && q.weight >= 25 && q.weight <= 300; }
function calcText(q){
  const c = calc(q);
  return `BMR ${fmt(c.bmr)} kcal (Mifflin–St Jeor) × activity ${q.activity} = ${fmt(c.tdee)} kcal maintenance` +
    (c.adj ? ` ${c.adj < 0 ? "−" : "+"} ${fmt(Math.abs(c.adj))} kcal for ${q.rate} kg/week (7,700 kcal per kg)` : "") +
    ` = ${fmt(c.kcal)} kcal/day` + (c.raw < c.floor ? ` (raised to the ${fmt(c.floor)} kcal minimum)` : "") + ".";
}
async function saveProfile(p){ const {isDefault, legacy, ...rest} = p; await safePut("profile", {...rest, kind:"profile"}); }
function openProfileSheet(first){
  const p = profile(); let q = p;
  const out = h("div", {class:"note"}, ic("target", 18), h("span"));
  const pf = profileFields(p, v => { q = {...p, ...v}; out.lastChild.textContent = validProfile(q) ? calcText(q) : "Fill in age, height and weight to see your target."; });
  const save = h("button", {class:"btn pri", text:first ? "Start tracking" : "Save"});
  save.onclick = async () => { if (!validProfile(q)){ toast("Check age, height and weight."); return; } closeLayer(); await saveProfile({...q, kcal:calc(q).kcal}); toast("Daily target set to " + fmt(calc(q).kcal) + " kcal"); };
  sheet(first ? "Create your profile" : "Your profile", h("div", {class:"stack"},
    first ? h("p", {class:"muted", style:"margin:0", text:"Enter your details and Thali works out your daily calorie target and macro split. You can change everything later in Goals."}) : null,
    pf.node, out), [first ? h("button", {class:"btn", text:"Later", onclick:closeLayer}) : null, save]);
}
function viewGoals(v){
  const p = profile();
  let q = p, kcal = goals().kcal, split = {...p.split};
  const kIn = h("input", {class:"inp", id:"g-kcal", type:"number", min:800, max:6000, value:kcal, style:"font-size:1.6rem;font-weight:900;color:var(--green);padding:12px 14px"});
  const totalEl = h("span", {class:"small"});
  const gramsEl = {};
  const save = h("button", {class:"btn pri", text:"Save goals"});
  const upd = () => {
    kcal = N(kIn.value); const tot = split.c + split.p + split.f;
    totalEl.textContent = `Total: ${tot}%`; totalEl.style.color = tot === 100 ? "var(--muted)" : "var(--pink)";
    gramsEl.c.textContent = `${fmt(kcal * split.c / 100 / 4)}g`; gramsEl.p.textContent = `${fmt(kcal * split.p / 100 / 4)}g`; gramsEl.f.textContent = `${fmt(kcal * split.f / 100 / 9)}g`;
    save.disabled = tot !== 100 || kcal < 800 || kcal > 6000;
  };
  kIn.oninput = upd;
  const mrow = (k, l, c) => { const inp = h("input", {class:"inp", id:"g-" + k, type:"number", min:0, max:100, value:split[k], style:"width:70px;text-align:center;font-weight:900;color:var(--green);background:var(--green-soft);border-color:transparent", "aria-label":l + " percent"});
    inp.oninput = () => { split[k] = r0(inp.value); upd(); }; gramsEl[k] = h("span", {class:"muted", style:"width:52px;text-align:right"});
    return h("div", {style:"display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)"}, h("span", {style:`width:9px;height:9px;border-radius:50%;background:${c}`}), h("span", {style:"flex:1", text:l}), inp, h("span", {class:"muted", text:"%"}), gramsEl[k]); };
  const calcOut = h("div", {class:"small"});
  const useBtn = h("button", {class:"btn soft", text:"Use this target"});
  const pf = profileFields(p, val => { q = {...p, ...val}; calcOut.textContent = validProfile(q) ? calcText(q) : "Fill in age, height and weight."; useBtn.disabled = !validProfile(q); });
  useBtn.onclick = () => { kIn.value = calc(q).kcal; upd(); };
  save.onclick = async () => { if (!validProfile(q)){ toast("Check age, height and weight."); return; } await saveProfile({...q, kcal:r0(kIn.value), split:{...split}, cycle:p.cycle}); toast("Goals saved"); };
  v.append(h("div", {class:"stack"},
    h("div", {class:"card dsum stack"}, h("label", {class:"small muted", for:"g-kcal", style:"font-weight:700", text:"Daily Calories (kcal)"}), kIn),
    h("div", {class:"card dsum"}, h("div", {style:"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"}, h("h3", {class:"h3", style:"color:var(--green)", text:"Macro Split"}), totalEl),
      mrow("c", "Carbohydrates", "var(--carbs)"), mrow("p", "Protein", "var(--protein)"), mrow("f", "Fat", "var(--fat)"),
      h("div", {class:"small muted", style:"margin-top:6px", text:"Grams use 4 kcal per gram of carbs and protein and 9 kcal per gram of fat."})),
    h("div", {class:"card dsum stack"}, h("h3", {class:"h3", text:"Your profile"}), pf.node,
      h("div", {class:"note"}, ic("target", 18), calcOut), h("div", {}, useBtn)),
    h("div", {style:"display:flex;justify-content:flex-end"}, save)));
  upd();
}

/* ================= boot ================= */
const hv = location.hash.slice(1); if (VIEWS.includes(hv)) S.view = hv;
render();
store.init();
(async () => {
  try { S.sample = await window.claude.use("sample"); } catch(e){ S.sample = null; }
  if (S.sample){ try { const lim = await S.sample.limits(); S.imgOK = !!lim?.images; } catch(e){ S.imgOK = false; } }
  if (!S.imgOK){ $("galBtn").hidden = true; $("camBtn").hidden = true; }
  render();
})();
})();
</script>
